<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(
        'SGIO | Dashboard',
        ~{}
)}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">

    <section class="welcome">
        <div>
            <p class="eyebrow">Panel operativo</p>
            <h2>Resumen de incidencias</h2>
            <p>
                Consulta el estado actual y las incidencias procesadas
                recientemente por SGIO.
            </p>
        </div>

        <div class="refresh-area">

		    <div class="refresh-actions">
		
		        <a class="refresh-button"
		           th:href="@{/dashboard}">
		            <i class="bi bi-arrow-clockwise"></i>
		            Actualizar
		        </a>
		
		        <button id="toggleAutoRefresh"
		                type="button"
		                class="auto-refresh-button active">
		            <i id="iconoAutoRefresh"
		               class="bi bi-pause-circle"></i>
		
		            <span id="textoAutoRefresh">
		                Pausar auto-refresh
		            </span>
		        </button>
		
		    </div>
		
		    <div class="last-update">
		        <span id="indicadorRefresh"
		              class="update-indicator"></span>
		
		        <span>
		            Última actualización:
		            <strong id="ultimaActualizacion">
		                --
		            </strong>
		        </span>
		    </div>
		
		</div>
    </section>

    <div id="contenedorCards">

	    <div th:replace="~{fragments/dashboard-cards :: dashboardCards}">
	    </div>
	
	</div>

    <section class="table-card">

        <div class="table-header">
            <div>
                <p class="eyebrow">Actividad reciente</p>
                <h3>Últimas incidencias</h3>
            </div>

            <span th:text="${totalRegistros} + ' registros encontrados'">
			    0 registros encontrados
			</span>
        </div>
        
        <section class="filters-card">

	    <form method="get"
	          th:action="@{/dashboard}"
	          class="filters-form">
	
	        <div class="filter-field search-field">
	
	            <label for="texto">
	                Buscar incidencia
	            </label>
	
	            <input
	                    id="texto"
	                    name="texto"
	                    type="text"
	                    th:value="${texto}"
	                    placeholder="Folio, cliente, CU o sucursal">
	
	        </div>
	
	        <div class="filter-field">
	
	            <label for="estado">
	                Estado
	            </label>
	
	            <select id="estado" name="estado">
	
	                <option value="">
	                    Todos los estados
	                </option>
	
	                <option
	                        th:each="estado : ${estados}"
	                        th:value="${estado}"
	                        th:text="${estado}"
	                        th:selected="${estado == estadoSeleccionado}">
	                    PENDIENTE
	                </option>
	
	            </select>
	
	        </div>
	
	        <div class="filter-actions">
	
	            <button type="submit"
	                    class="search-button">
	                Buscar
	            </button>
	
	            <a th:href="@{/dashboard}"
	               class="clear-button">
	                Limpiar
	            </a>
	
	        </div>
	
	    </form>
	
	</section>

      <div id="contenedorTabla">
	    <div th:replace="~{fragments/incidencias-table :: tablaIncidencias}">
	    </div>
	  </div>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    const INTERVALO_REFRESH = 15000;
    
    function obtenerEstadoActualTabla() {
        const filas =
            document.querySelectorAll(
                "#contenedorTabla .incidencia-row"
            );

        const incidencias = new Map();

        filas.forEach(fila => {
            const folio = fila.dataset.folio;
            const estado = fila.dataset.estado;

            if (folio) {
                incidencias.set(folio, estado);
            }
        });

        return incidencias;
    }

    function resaltarCambios(estadoAnterior) {
        const filas =
            document.querySelectorAll(
                "#contenedorTabla .incidencia-row"
            );

        filas.forEach(fila => {
            const folio = fila.dataset.folio;
            const estadoNuevo = fila.dataset.estado;

            if (!folio) {
                return;
            }

            if (!estadoAnterior.has(folio)) {
                aplicarAnimacion(
                    fila,
                    "incidencia-nueva"
                );

                return;
            }

            const estadoAnteriorFila =
                estadoAnterior.get(folio);

            if (estadoAnteriorFila !== estadoNuevo) {
                aplicarAnimacion(
                    fila,
                    "incidencia-actualizada"
                );
            }
        });
    }

    function aplicarAnimacion(elemento, clase) {
        elemento.classList.add(clase);

        setTimeout(() => {
            elemento.classList.remove(clase);
        }, 3500);
    }

    async function actualizarTabla() {
        const contenedorTabla =
            document.getElementById("contenedorTabla");

        if (!contenedorTabla) {
            console.error(
                "No se encontró el contenedor de la tabla."
            );
            return;
        }

        const url = construirUrl(
            "/dashboard/fragment/incidencias"
        );

        try {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `Error HTTP al actualizar tabla: ${response.status}`
                );
            }

            const estadoAnterior =
                obtenerEstadoActualTabla();

            const nuevoContenido =
                await response.text();

            contenedorTabla.innerHTML =
                nuevoContenido;

            resaltarCambios(estadoAnterior);

        } catch (error) {
            console.error(
                "Error actualizando la tabla:",
                error
            );
        }
    }

    async function actualizarCards() {
        const contenedorCards =
            document.getElementById("contenedorCards");

        if (!contenedorCards) {
            console.error(
                "No se encontró el contenedor de las tarjetas."
            );
            return;
        }

        const url = construirUrl(
            "/dashboard/fragment/cards"
        );

        try {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `Error HTTP al actualizar tarjetas: ${response.status}`
                );
            }

            contenedorCards.innerHTML =
                await response.text();

        } catch (error) {
            console.error(
                "Error actualizando las tarjetas:",
                error
            );
        }
    }

    function construirUrl(endpoint) {
        const parametrosActuales =
            new URLSearchParams(window.location.search);

        return parametrosActuales.toString()
            ? `${endpoint}?${parametrosActuales.toString()}`
            : endpoint;
    }
    
    function actualizarHora() {
        const elemento =
            document.getElementById("ultimaActualizacion");

        if (!elemento) {
            return;
        }

        const ahora = new Date();

        elemento.textContent =
            ahora.toLocaleTimeString(
                "es-MX",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );
    }

    async function actualizarDashboard() {
        try {
            await Promise.all([
                actualizarCards(),
                actualizarTabla()
            ]);

            actualizarHora();

            console.log(
                "Dashboard actualizado:",
                new Date().toLocaleTimeString()
            );

        } catch (error) {
            console.error(
                "Error actualizando el Dashboard:",
                error
            );
        }
    }

    let autoRefreshActivo = true;
    let temporizadorRefresh = null;

    function iniciarAutoRefresh() {
        detenerAutoRefresh();

        temporizadorRefresh = setInterval(
            actualizarDashboard,
            INTERVALO_REFRESH
        );
    }

    function detenerAutoRefresh() {
        if (temporizadorRefresh !== null) {
            clearInterval(temporizadorRefresh);
            temporizadorRefresh = null;
        }
    }

    function actualizarEstadoAutoRefresh() {
        const boton =
            document.getElementById("toggleAutoRefresh");

        const texto =
            document.getElementById("textoAutoRefresh");

        const icono =
            document.getElementById("iconoAutoRefresh");

        const indicador =
            document.getElementById("indicadorRefresh");

        if (!boton || !texto || !icono || !indicador) {
            return;
        }

        if (autoRefreshActivo) {
            boton.classList.add("active");

            texto.textContent =
                "Pausar auto-refresh";

            icono.className =
                "bi bi-pause-circle";

            indicador.classList.remove("paused");
        } else {
            boton.classList.remove("active");

            texto.textContent =
                "Activar auto-refresh";

            icono.className =
                "bi bi-play-circle";

            indicador.classList.add("paused");
        }
    }

    function alternarAutoRefresh() {
        autoRefreshActivo = !autoRefreshActivo;

        if (autoRefreshActivo) {
            actualizarDashboard();
            iniciarAutoRefresh();
        } else {
            detenerAutoRefresh();
        }

        actualizarEstadoAutoRefresh();
    }

    document
        .getElementById("toggleAutoRefresh")
        ?.addEventListener(
            "click",
            alternarAutoRefresh
        );

    actualizarDashboard();
    iniciarAutoRefresh();
    actualizarEstadoAutoRefresh();
</script>

</body>
</html>
