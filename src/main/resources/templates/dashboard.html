<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(
        'SGIO | Dashboard',
        ~{}
)}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">

    <section class="welcome">
        <div>
            <p class="eyebrow">Panel operativo</p>
            <h2>Resumen de incidencias</h2>
            <p>
                Consulta el estado actual y las incidencias procesadas
                recientemente por SGIO.
            </p>
        </div>

        <a class="refresh-button" th:href="@{/dashboard}">
            Actualizar
        </a>
    </section>

    <section class="cards row g-4 mb-4">

	<div class="col-xl-3 col-md-6">
	        <div th:replace="~{fragments/metric-card :: metricCard(
	                'Total',
	                ${total},
	                'Incidencias registradas',
	                'bi-clipboard-data',
	                'metric-icon-total'
	        )}">
	        </div>
	    </div>
	
	    <div class="col-xl-3 col-md-6">
	        <div th:replace="~{fragments/metric-card :: metricCard(
	                'Pendientes',
	                ${pendientes},
	                'Esperando atención',
	                'bi-hourglass-split',
	                'metric-icon-pendiente'
	        )}">
	        </div>
	    </div>
	
	    <div class="col-xl-3 col-md-6">
	        <div th:replace="~{fragments/metric-card :: metricCard(
	                'En proceso',
	                ${enProceso},
	                'Actualmente atendidas',
	                'bi-arrow-repeat',
	                'metric-icon-proceso'
	        )}">
	        </div>
	    </div>
	
	    <div class="col-xl-3 col-md-6">
	        <div th:replace="~{fragments/metric-card :: metricCard(
	                'Resueltas',
	                ${resueltas},
	                'Atención terminada',
	                'bi-check-circle',
	                'metric-icon-resuelta'
	        )}">
	        </div>
	    </div>
	    
	    <div class="col-xl-3 col-md-6">
		    <div th:replace="~{fragments/metric-card :: metricCard(
		            'Reabiertas',
		            ${reabiertas},
		            'Requieren seguimiento',
		            'bi-arrow-counterclockwise',
		            'metric-icon-reabierta'
		    )}">
		    </div>
		</div>	
	</section>

    <section class="table-card">

        <div class="table-header">
            <div>
                <p class="eyebrow">Actividad reciente</p>
                <h3>Últimas incidencias</h3>
            </div>

            <span th:text="${totalRegistros} + ' registros encontrados'">
			    0 registros encontrados
			</span>
        </div>
        
        <section class="filters-card">

	    <form method="get"
	          th:action="@{/dashboard}"
	          class="filters-form">
	
	        <div class="filter-field search-field">
	
	            <label for="texto">
	                Buscar incidencia
	            </label>
	
	            <input
	                    id="texto"
	                    name="texto"
	                    type="text"
	                    th:value="${texto}"
	                    placeholder="Folio, cliente, CU o sucursal">
	
	        </div>
	
	        <div class="filter-field">
	
	            <label for="estado">
	                Estado
	            </label>
	
	            <select id="estado" name="estado">
	
	                <option value="">
	                    Todos los estados
	                </option>
	
	                <option
	                        th:each="estado : ${estados}"
	                        th:value="${estado}"
	                        th:text="${estado}"
	                        th:selected="${estado == estadoSeleccionado}">
	                    PENDIENTE
	                </option>
	
	            </select>
	
	        </div>
	
	        <div class="filter-actions">
	
	            <button type="submit"
	                    class="search-button">
	                Buscar
	            </button>
	
	            <a th:href="@{/dashboard}"
	               class="clear-button">
	                Limpiar
	            </a>
	
	        </div>
	
	    </form>
	
	</section>

       <div th:replace="~{fragments/incidencias-table :: tablaIncidencias}"></div>
        
        <nav th:if="${totalPaginas > 1}"
		     class="d-flex justify-content-between align-items-center p-3"
		     aria-label="Paginación de incidencias">
		
		    <span class="text-muted small"
		          th:text="'Página ' + (${paginaActual} + 1)
		                   + ' de ' + ${totalPaginas}">
		        Página 1 de 1
		    </span>
		
		    <ul class="pagination pagination-sm mb-0">
		
		        <li class="page-item"
		            th:classappend="${paginaActual == 0} ? 'disabled'">
		
		            <a class="page-link"
		               th:href="@{/dashboard(
		                    page=${paginaActual - 1},
		                    size=10,
		                    texto=${texto},
		                    estado=${estadoSeleccionado}
		               )}">
		                <i class="bi bi-chevron-left"></i>
		                Anterior
		            </a>
		
		        </li>
		
		        <li class="page-item"
		            th:each="numero : ${#numbers.sequence(0, totalPaginas - 1)}"
		            th:classappend="${numero == paginaActual} ? 'active'">
		
		            <a class="page-link"
		               th:href="@{/dashboard(
		                    page=${numero},
		                    size=10,
		                    texto=${texto},
		                    estado=${estadoSeleccionado}
		               )}"
		               th:text="${numero + 1}">
		                1
		            </a>
		
		        </li>
		
		        <li class="page-item"
		            th:classappend="${paginaActual + 1 >= totalPaginas} ? 'disabled'">
		
		            <a class="page-link"
		               th:href="@{/dashboard(
		                    page=${paginaActual + 1},
		                    size=10,
		                    texto=${texto},
		                    estado=${estadoSeleccionado}
		               )}">
		                Siguiente
		                <i class="bi bi-chevron-right"></i>
		            </a>
		
		        </li>
		
		    </ul>
		
		</nav>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
