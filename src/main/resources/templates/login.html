<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGIO | Iniciar sesión</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 45px;
            color: #2563eb;
        }

        .logo h1 {
            margin: 10px 0 5px;
            font-size: 28px;
        }

        .logo p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .mensaje-error {
            margin-bottom: 20px;
            padding: 10px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            font-size: 14px;
        }

        .mensaje-logout {
            margin-bottom: 20px;
            padding: 10px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <i class="bi bi-shield-check"></i>
        <h1>SGIO</h1>
        <p>Sistema de Gestión de Incidencias Operativas</p>
    </div>

    <div class="mensaje-error"
         th:if="${param.error}">
        Usuario o contraseña incorrectos.
    </div>

    <div class="mensaje-logout"
         th:if="${param.logout}">
        Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text"
                   id="username"
                   name="username"
                   autocomplete="username"
                   required
                   autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password"
                   id="password"
                   name="password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit">
            <i class="bi bi-box-arrow-in-right"></i>
            Iniciar sesión
        </button>

    </form>

</div>

</body>
</html>
