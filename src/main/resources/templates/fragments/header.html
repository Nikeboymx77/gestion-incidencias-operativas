<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header"
        class="topbar navbar navbar-dark bg-dark shadow-sm">

    <div class="container-fluid">

        <div class="navbar-brand">

            <h1 class="mb-0">
                <i class="bi bi-speedometer2 me-2"></i>
                SGIO
            </h1>

            <p class="mb-0">
                Sistema de Gestión de Incidencias Operativas
            </p>

        </div>

        <div class="header-actions">

		    <!-- SELECTOR DE TEMA -->
		
		    <div class="theme-selector"
		         aria-label="Seleccionar tema">
		
		        <button type="button"
		                class="theme-button"
		                data-theme-option="light"
		                title="Tema claro">
		
		            <i class="bi bi-sun"></i>
		
		        </button>
		
		        <button type="button"
		                class="theme-button"
		                data-theme-option="dark"
		                title="Tema oscuro">
		
		            <i class="bi bi-moon-stars"></i>
		
		        </button>
		
		        <button type="button"
		                class="theme-button"
		                data-theme-option="system"
		                title="Usar tema del sistema">
		
		            <i class="bi bi-display"></i>
		
		        </button>
		
		    </div>
		
		
		    <!-- ESTADO DEL SISTEMA -->
		
		    <div class="status d-flex align-items-center gap-2">
		
		        <span class="status-dot"></span>
		
		        <span>
		            Sistema activo
		        </span>
		
		    </div>
		
		</div>

    </div>

</header>

</body>
</html>
