<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="header"
        class="topbar navbar navbar-dark bg-dark shadow-sm">

    <div class="container-fluid">

        <div class="navbar-brand">

            <h1 class="mb-0">
                <i class="bi bi-speedometer2 me-2"></i>
                SGIO
            </h1>

            <p class="mb-0">
                Sistema de Gestión de Incidencias Operativas
            </p>

        </div>

        <div class="header-actions">
        
        	<!-- MENÚ DE NAVEGACIÓN -->
			<div class="dropdown">
			
			    <button class="btn btn-outline-light dropdown-toggle"
			            type="button"
			            id="menuModulos"
			            data-bs-toggle="dropdown"
			            aria-expanded="false">
			
			        <i class="bi bi-grid-3x3-gap me-1"></i>
			        Módulos
			
			    </button>
			
			    <ul class="dropdown-menu dropdown-menu-end"
			        aria-labelledby="menuModulos">
			
			        <li>
			            <a class="dropdown-item"
			               th:href="@{/dashboard}">
			                <i class="bi bi-speedometer2 me-2"></i>
			                Dashboard
			            </a>
			        </li>
			
			        <li>
			            <a class="dropdown-item"
			               th:href="@{/reportes}">
			                <i class="bi bi-bar-chart-line me-2"></i>
			                Reportes
			            </a>
			        </li>
			
			        <li sec:authorize="hasRole('ADMIN')">
			            <hr class="dropdown-divider">
			        </li>
			
			        <li sec:authorize="hasRole('ADMIN')">
			            <a class="dropdown-item"
			               th:href="@{/empleados}">
			                <i class="bi bi-people me-2"></i>
			                Empleados
			            </a>
			        </li>
			
			        <li sec:authorize="hasRole('ADMIN')">
			            <a class="dropdown-item"
			               th:href="@{/usuarios}">
			                <i class="bi bi-person-gear me-2"></i>
			                Usuarios
			            </a>
			        </li>
			
			    </ul>
			
			</div>

		    <!-- SELECTOR DE TEMA -->
		
		    <div class="theme-selector"
		         aria-label="Seleccionar tema">
		
		        <button type="button"
		                class="theme-button"
		                data-theme-option="light"
		                title="Tema claro">
		
		            <i class="bi bi-sun"></i>
		
		        </button>
		
		        <button type="button"
		                class="theme-button"
		                data-theme-option="dark"
		                title="Tema oscuro">
		
		            <i class="bi bi-moon-stars"></i>
		
		        </button>
		
		        <button type="button"
		                class="theme-button"
		                data-theme-option="system"
		                title="Usar tema del sistema">
		
		            <i class="bi bi-display"></i>
		
		        </button>
		
		    </div>
		
		
		    <!-- ESTADO DEL SISTEMA -->
		
		    <div class="status d-flex align-items-center gap-2">
		
		        <span class="status-dot"></span>
		
		        <span>
		            Sistema activo
		        </span>
		
		    </div>
		    
		    <!-- USUARIO AUTENTICADO -->

			<div class="user-session d-flex align-items-center gap-2">
			
			    <i class="bi bi-person-circle"></i>
			
			    <div class="user-session-info">
			
			        <span sec:authentication="name"></span>
			
			        <small sec:authorize="hasRole('ADMIN')">
			            ADMIN
			        </small>
			
			        <small sec:authorize="hasRole('OPERADOR')">
			            OPERADOR
			        </small>
			
			    </div>
			
			</div>
			
			
			<!-- CERRAR SESIÓN -->
			
			<form th:action="@{/logout}"
			      method="post"
			      class="m-0">
			
			    <button type="submit"
			            class="btn btn-outline-light btn-sm">
			
			        <i class="bi bi-box-arrow-right me-1"></i>
			        Cerrar sesión
			
			    </button>
			
			</form>
		    	
		</div>
		

    </div>

</header>

</body>
</html>
