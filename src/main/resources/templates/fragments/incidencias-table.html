<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="tablaIncidencias"
     class="table-responsive table-container">

    <table class="table table-hover align-middle mb-0">

        <thead class="table-light">
        <tr>
            <th>
                <i class="bi bi-hash"></i>
                Folio
            </th>

            <th>
                <i class="bi bi-person"></i>
                Cliente
            </th>

            <th>
                <i class="bi bi-building"></i>
                Sucursal
            </th>

            <th>
                <i class="bi bi-flag"></i>
                Estado
            </th>

            <th>
                <i class="bi bi-exclamation-circle"></i>
                Prioridad
            </th>

            <th>
                <i class="bi bi-person-workspace"></i>
                Asignado
            </th>

            <th>
                <i class="bi bi-calendar-event"></i>
                Fecha
            </th>

            <th class="text-center">
                Acción
            </th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(incidencias)}">
            <td colspan="8"
                class="empty-state">
                No hay incidencias registradas.
            </td>
        </tr>

        <tr th:each="incidencia : ${incidencias}"
		    class="incidencia-row"
		    th:attr="data-folio=${incidencia.folio},
		             data-estado=${incidencia.estado}">

            <td>
                <a class="folio-link"
                   th:href="@{/dashboard/incidencias/{folio}(
                        folio=${incidencia.folio}
                   )}"
                   th:text="${incidencia.folio}">
                    INC000001
                </a>
            </td>

            <td th:text="${incidencia.nombreCliente != null
                    ? incidencia.nombreCliente
                    : 'No identificado'}">
                Cliente
            </td>

            <td th:text="${incidencia.sucursal != null
                    ? incidencia.sucursal
                    : 'No identificada'}">
                Sucursal
            </td>

            <td>
                <span class="badge"
                      th:classappend="${#strings.toLowerCase(
                          incidencia.estado.toString()
                      )}"
                      th:text="${incidencia.estado}">
                    PENDIENTE
                </span>
            </td>

            <td>
                <span class="badge badge-prioridad rounded-pill"
                      th:classappend="${incidencia.prioridad != null
                          ? ' prioridad-' +
                            #strings.toLowerCase(
                                incidencia.prioridad.toString()
                            )
                          : ' prioridad-sin-definir'}"
                      th:text="${incidencia.prioridad != null
                          ? incidencia.prioridad
                          : 'SIN DEFINIR'}">
                    MEDIA
                </span>
            </td>

            <td th:text="${incidencia.empleadoAsignado != null
                    ? incidencia.empleadoAsignado.nombre
                    : 'Sin asignar'}">
                Empleado
            </td>

            <td th:text="${incidencia.fechaAsignacion != null
                    ? #temporals.format(
                        incidencia.fechaAsignacion,
                        'dd/MM/yyyy HH:mm'
                      )
                    : '-'}">
                15/07/2026
            </td>

            <td class="text-center">

                <a class="btn btn-outline-primary btn-sm"
                   title="Ver detalle"
                   aria-label="Ver detalle de la incidencia"
                   th:href="@{/dashboard/incidencias/{folio}(
                        folio=${incidencia.folio}
                   )}">

                    <i class="bi bi-eye"></i>

                </a>

            </td>

        </tr>

        </tbody>

    </table>
    
    <nav th:if="${totalPaginas > 1}"
	     class="d-flex justify-content-between align-items-center p-3 flex-wrap gap-3"
	     aria-label="Paginación de incidencias">
	
	    <span class="text-muted small"
	          th:text="'Página ' + (${paginaActual} + 1)
	                   + ' de ' + ${totalPaginas}">
	        Página 1 de 1
	    </span>
	
	    <ul class="pagination pagination-sm mb-0 flex-wrap">
	
	        <!-- Anterior -->
	        <li class="page-item"
	            th:classappend="${paginaActual == 0} ? 'disabled'">
	
	            <a class="page-link"
	               th:href="@{/dashboard(
	                    page=${paginaActual - 1},
	                    size=10,
	                    texto=${texto},
	                    estado=${estadoSeleccionado},
	                    empleadoId=${empleadoSeleccionado}
	               )}">
	                <i class="bi bi-chevron-left"></i>
	                Anterior
	            </a>
	
	        </li>
	
	        <!-- Primera página -->
	        <li class="page-item"
	            th:classappend="${paginaActual == 0} ? 'active'">
	
	            <a class="page-link"
	               th:href="@{/dashboard(
	                    page=0,
	                    size=10,
	                    texto=${texto},
	                    estado=${estadoSeleccionado},
	                    empleadoId=${empleadoSeleccionado}
	               )}">
	                1
	            </a>
	
	        </li>
	
	        <!-- Puntos suspensivos a la izquierda -->
	        <li class="page-item disabled"
	            th:if="${paginaActual > 3}">
	
	            <span class="page-link">
	                ...
	            </span>
	
	        </li>
	
	        <!-- Páginas cercanas a la actual -->
	        <th:block th:if="${totalPaginas > 2}">
	
	            <li class="page-item"
	                th:each="numero : ${#numbers.sequence(
	                    T(java.lang.Math).max(1, paginaActual - 2),
	                    T(java.lang.Math).min(totalPaginas - 2, paginaActual + 2)
	                )}"
	                th:classappend="${numero == paginaActual} ? 'active'">
	
	                <a class="page-link"
	                   th:href="@{/dashboard(
	                        page=${numero},
	                        size=10,
	                        texto=${texto},
	                        estado=${estadoSeleccionado},
	                        empleadoId=${empleadoSeleccionado}
	                   )}"
	                   th:text="${numero + 1}">
	                    2
	                </a>
	
	            </li>
	
	        </th:block>
	
	        <!-- Puntos suspensivos a la derecha -->
	        <li class="page-item disabled"
	            th:if="${paginaActual < totalPaginas - 4}">
	
	            <span class="page-link">
	                ...
	            </span>
	
	        </li>
	
	        <!-- Última página -->
	        <li class="page-item"
	            th:classappend="${paginaActual == totalPaginas - 1} ? 'active'">
	
	            <a class="page-link"
	               th:href="@{/dashboard(
	                    page=${totalPaginas - 1},
	                    size=10,
	                    texto=${texto},
	                    estado=${estadoSeleccionado},
	                    empleadoId=${empleadoSeleccionado}
	               )}"
	               th:text="${totalPaginas}">
	                11
	            </a>
	
	        </li>
	
	        <!-- Siguiente -->
	        <li class="page-item"
	            th:classappend="${paginaActual + 1 >= totalPaginas} ? 'disabled'">
	
	            <a class="page-link"
	               th:href="@{/dashboard(
	                    page=${paginaActual + 1},
	                    size=10,
	                    texto=${texto},
	                    estado=${estadoSeleccionado},
	                    empleadoId=${empleadoSeleccionado}
	               )}">
	                Siguiente
	                <i class="bi bi-chevron-right"></i>
	            </a>
	
	        </li>
	
	    </ul>
	
	</nav>
</div>
