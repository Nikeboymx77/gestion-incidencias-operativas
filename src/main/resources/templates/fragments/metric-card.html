<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<body>

<article th:fragment="metricCard(titulo, valor, descripcion, icono, claseColor)"
         class="metric-card card h-100 border-0 shadow-sm">

    <div class="card-body d-flex align-items-center gap-3">

        <div class="metric-icon"
             th:classappend="${claseColor}">

            <i class="bi"
               th:classappend="${icono}">
            </i>

        </div>

        <div class="flex-grow-1">

            <p class="metric-title text-muted mb-1"
               th:text="${titulo}">
                Título
            </p>

            <strong class="metric-value d-block fw-bold mb-1"
                    th:text="${valor}">
                0
            </strong>

            <span class="metric-description"
                  th:text="${descripcion}">
                Descripción
            </span>

        </div>

    </div>

</article>

</body>
</html>
